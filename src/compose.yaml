services:
  organizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MUSIC_IMAGE:-changchxy/music-mate:1.1.0}
    pull_policy: if_not_present
    container_name: music-mate-organizer
    restart: unless-stopped
    environment:
      MUSIC_STATE: /appdata/v6-state
      MUSIC_STATE_LIMIT_BYTES: "536870912"
      MUSIC_UI_PORT: "${service_port:-8091}"
      TRIM_DATA_ACCESSIBLE_PATHS: "${TRIM_DATA_ACCESSIBLE_PATHS:-}"
      MUSIC_MOUNT_SOURCE: "${source_dir:-}"
      MUSIC_MOUNT_OUTPUT: "${output_dir:-}"
      MUSIC_SAFE_SIMILARITY: "0.997"
      MUSIC_SAFE_DURATION_DELTA: "4.5"
      MUSIC_METADATA_WORKERS: "${MUSIC_METADATA_WORKERS:-auto}"
      MUSIC_CACHE_DIR: /appdata/cache
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${source_dir}:${source_dir}:ro"
      - "${output_dir}:${output_dir}:rw"
      - "${TRIM_PKGVAR}:/appdata:rw"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${service_port:-8091}:8091"
    user: "${TRIM_USER_UID:-1000}:${TRIM_USER_GID:-1000}"
    command: ["python3", "/opt/music-rebuild/app.py"]

